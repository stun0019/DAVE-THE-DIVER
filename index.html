<script>
(()=>{

const levelImages=levels.map(level=>level.files.map(()=>new Image()));
const worldLayer=document.createElement('canvas');worldLayer.width=WORLD_W;worldLayer.height=CAMERA_H;const worldCtx=worldLayer.getContext('2d');

levelImages.forEach((images,level)=>images.forEach((image,index)=>{image.onload=()=>{if(currentLevel===level)composeWorld()};image.onerror=()=>{if(currentLevel===level)document.querySelector('.location').textContent='場景載入失敗，請重新整理';};image.src=levels[level].files[index]}));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const held=new Set(),diver={x:.1333333333,y:.48,dir:1,vx:0,vy:0},bubbles=[];
const bossArt=new Image();bossArt.src='boss-reef-king.png';
const bossTexture=document.createElement('canvas');const bossTex=bossTexture.getContext('2d');

let bossDeathTime=0;
const bossPatrol={x:3300,y:430,dir:-1};
function resetBossPatrol(){bossDeathTime=0;bossPatrol.x=3300;bossPatrol.y=430;bossPatrol.dir=-1;}
const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function bossTriangle(a,b,c,sa,sb,sc){
 ctx.save();ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.closePath();ctx.clip();

 const m=(v1,v2,v3)=>[(v1*(sb.y-sc.y)+v2*(sc.y-sa.y)+v3*(sa.y-sb.y))/den,(v1*(sc.x-sb.x)+v2*(sa.x-sc.x)+v3*(sb.x-sa.x))/den,(v1*(sb.x*sc.y-sc.x*sb.y)+v2*(sc.x*sa.y-sa.x*sc.y)+v3*(sa.x*sb.y-sb.x*sa.y))/den];

}
function paintBoss(dt){
 const effectDt=dt;if(bossHP<=0)bossDeathTime=Math.min(1.4,bossDeathTime+dt);else bossDeathTime=0;const opacity=1-ease(bossDeathTime/1.4);scene.dataset.bossOpacity=opacity.toFixed(3);if(opacity<=0){bossTarget=null;bossDust.length=0;return;}
 dt*=levels[currentLevel].speed;if(bossHP<=0){dt=0;bossPhase='defeated'}bossTime+=dt;phaseTime+=dt;if(!bossTexture.width||!bossArt.complete||!bossArt.naturalWidth)return;
 const bounds=waterBounds(),bw=Math.max(168,Math.min(410,w*.43)),bh=bw*bossArt.naturalHeight/bossArt.naturalWidth;
 if(bossPhase==='patrol'&&dt>0){
  bossPatrol.x+=bossPatrol.dir*68*dt;

  else if(bossPatrol.x>=3540){bossPatrol.x=3540;bossPatrol.dir=-1;}
  bossPatrol.y+=(420+Math.sin(bossTime*.35)*55-bossPatrol.y)*(1-Math.exp(-dt*2));
 }
 const homeX=bossPatrol.x,homeY=bossPatrol.y;
 const near=Math.hypot(diver.x*w-homeX,bounds.top+diver.y*bounds.height-homeY)<bw*.95;
 if(bossPhase==='patrol'&&near&&phaseTime>2.8){bossPhase='windup';phaseTime=0;bossPatrol.dir=diver.x*w<homeX?-1:1;}
 else if(bossPhase==='windup'&&phaseTime>1.1){bossPhase='strike';phaseTime=0;for(let i=0;i<20;i++)bossDust.push({x:homeX+bossPatrol.dir*bw*.3,y:homeY-bh*.1,vx:bossPatrol.dir*(30+Math.random()*75),vy:(Math.random()-.5)*75,life:0,r:1+Math.random()*3})}
 else if(bossPhase==='strike'&&phaseTime>.48){bossPhase='recover';phaseTime=0}
 else if(bossPhase==='recover'&&phaseTime>1.2){bossPhase='patrol';phaseTime=0}
 let charge=0,hit=0;if(bossPhase==='windup')charge=ease(phaseTime/1.1);if(bossPhase==='strike'){charge=1-ease(phaseTime/.48);hit=Math.sin(Math.PI*Math.min(1,phaseTime/.48))}if(bossPhase==='recover')charge=-.15*(1-ease(phaseTime/1.2));
 const bx=bossHP<=0&&bossTarget?bossTarget.x:homeX+bossPatrol.dir*(hit*bw*.23-charge*bw*.035),by=bossHP<=0&&bossTarget?bossTarget.y:homeY+Math.sin(bossTime*1.7)*4-charge*bh*.045;
 bossTarget={x:bx,y:by,w:bw,h:bh,flip:-bossPatrol.dir};scene.dataset.bossX=bx.toFixed(1);scene.dataset.bossY=by.toFixed(1);scene.dataset.bossFacing=bossPatrol.dir===1?'right':'left';scene.dataset.bossHp=String(bossHP);ctx.save();ctx.globalAlpha=opacity;ctx.filter=(currentLevel===1?'hue-rotate(45deg) saturate(1.25) ':'')+(hitFlash>0?'brightness(1.9)':'brightness(1)');ctx.translate(bx,by);ctx.scale(-bossPatrol.dir,1);ctx.rotate(Math.sin(bossTime*.8)*.025-hit*.045);ctx.imageSmoothingEnabled=true;
 const cols=14,rows=10,mesh=[];
 for(let j=0;j<=rows;j++){mesh[j]=[];for(let i=0;i<=cols;i++){
 const u=i/cols,v=j/rows;let px=u,py=v;
 const claw=ease((.49-u)/.22),angle=(Math.sin(bossTime*1.9)*.07-charge*.21+hit*.32)*claw;
 const ox=u-.43,oy=v-.46;px+=((ox*Math.cos(angle)-oy*Math.sin(angle))-ox)*claw;py+=((ox*Math.sin(angle)+oy*Math.cos(angle))-oy)*claw;
 const jaw=claw*ease((v-.31)/.2)*(1-ease((v-.66)/.12));py+=jaw*(Math.sin(bossTime*2.2)*.016+charge*.035-hit*.07);
 const leg=ease((v-.62)/.25),legWave=Math.sin(bossTime*3.5+u*18);px+=leg*legWave*.019;py+=leg*Math.cos(bossTime*3.5+u*18)*.013;
 const shell=ease((u-.38)/.2)*(1-leg);py+=shell*Math.sin(bossTime*2)*.006;
 mesh[j][i]={p:{x:(px-.5)*bw,y:(py-.5)*bh},s:{x:u*bossTexture.width,y:v*bossTexture.height}};
 }}
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=mesh[j][i],b=mesh[j][i+1],c=mesh[j+1][i],d=mesh[j+1][i+1];bossTriangle(a.p,b.p,c.p,a.s,b.s,c.s);bossTriangle(b.p,d.p,c.p,b.s,d.s,c.s)}
 if(charge>0){ctx.globalCompositeOperation='screen';ctx.fillStyle='rgba(255,155,70,'+(charge*.42)+')';ctx.shadowColor='#ff922f';ctx.shadowBlur=12;for(const eye of [[.501,.35],[.598,.37]]){ctx.beginPath();ctx.arc((eye[0]-.5)*bw,(eye[1]-.5)*bh,bw*.014,0,Math.PI*2);ctx.fill()}}
 ctx.restore();
 for(let i=bossDust.length-1;i>=0;i--){const p=bossDust[i];p.life+=effectDt;p.x+=p.vx*effectDt;p.y+=p.vy*effectDt;ctx.fillStyle='rgba(168,228,224,'+Math.max(0,.65-p.life*.45)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(p.life>1.4)bossDust.splice(i,1)}
 const barW=bw*.65,barY=by-bh/2-14;ctx.save();ctx.globalAlpha=opacity;ctx.textAlign='center';ctx.font='600 '+Math.max(11,Math.min(16,w*.02))+'px system-ui';ctx.shadowColor='#031d30';ctx.shadowBlur=8;ctx.fillStyle='#f4e4c9';ctx.fillText(levels[currentLevel].boss,bx,barY-12);ctx.shadowBlur=0;
 ctx.fillStyle='rgba(3,21,32,.9)';ctx.fillRect(bx-barW/2-2,barY-2,barW+4,7);ctx.fillStyle=bossPhase==='patrol'?'#99bab1':'#df9564';ctx.fillRect(bx-barW/2,barY,barW*bossHP/levels[currentLevel].hp,3);
 ctx.font='10px system-ui';ctx.fillStyle='#e7e5d2';ctx.fillText({patrol:'巡游',windup:'蓄力',strike:'揮螯',recover:'收勢',defeated:'已擊敗'}[bossPhase],bx,barY+18);ctx.restore();scene.dataset.bossPhase=bossPhase;
}
let swimTime=0,bubbleTime=0;
const foreground=document.createElement('div');foreground.className='landscape foreground';foreground.setAttribute('aria-hidden','true');scene.insertBefore(foreground,document.querySelector('.shade'));

 r(53,19,5,3,'#101f2d');r(56,20,3,4,'#233646');r(41,19,3,8,'#263e4c');r(42,24,10,4,'#10283e');r(51,25,6,3,'#d9a477');
 r(29,28,12,3,'#bd9339');r(31,27,3,5,'#edc557');r(19,18,3,4,'#294d62');
 ctx.save();ctx.translate(px,py+Math.sin(swimTime*.45)*1.3);ctx.scale(diver.dir*scale,scale);ctx.rotate(Math.max(-.16,Math.min(.16,diver.vy/800))*diver.dir);ctx.imageSmoothingEnabled=false;ctx.drawImage(sprite,-32,-20);ctx.restore();
 scene.dataset.playerX=diver.x.toFixed(4);scene.dataset.playerY=diver.y.toFixed(4);scene.dataset.facing=diver.dir===1?'right':'left';
}
window.addEventListener('keydown',event=>{if(!['KeyW','KeyA','KeyS','KeyD'].includes(event.code)||event.ctrlKey||event.metaKey||event.altKey||/INPUT|TEXTAREA|SELECT/.test(event.target.tagName)||event.target.isContentEditable)return;held.add(event.code);scene.classList.add('playing');event.preventDefault()});
window.addEventListener('keyup',event=>held.delete(event.code));
window.addEventListener('blur',()=>{firing=false;firePointer=null;held.clear();diver.vx=0;diver.vy=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden){firing=false;firePointer=null;held.clear();diver.vx=0;diver.vy=0}});
function fireHarpoon(){
 const aimElement=document.elementFromPoint(aimClientX,aimClientY);if(aimElement&&aimElement.closest('button,header,footer'))return;const area=scene.getBoundingClientRect(),screenX=(aimClientX-area.left)*CAMERA_W/area.width,ty=(aimClientY-area.top)*CAMERA_H/area.height,tx=cameraX+screenX,bounds=waterBounds();
 if(!worldReady||screenX<0||screenX>CAMERA_W||ty<bounds.top||ty>bounds.bottom||combatTime-lastShot<.3)return;
 const px=diver.x*w,py=bounds.top+diver.y*bounds.height,dx=tx-px,dy=ty-py,len=Math.hypot(dx,dy);if(len<5)return;
 lastShot=combatTime;totalShots++;diver.dir=dx>=0?1:-1;scene.classList.add('playing');harpoons.push({x:px,y:py,vx:dx/len*620,vy:dy/len*620,angle:Math.atan2(dy,dx),age:0});
}
scene.addEventListener('pointerdown',event=>{
 if(event.button!==0||event.target.closest('button,a,header,footer'))return;
 scene.focus({preventScroll:true});aimClientX=event.clientX;aimClientY=event.clientY;firePointer=event.pointerId;firing=true;fireHarpoon();
});
window.addEventListener('pointermove',event=>{if(!firing||event.pointerId!==firePointer)return;aimClientX=event.clientX;aimClientY=event.clientY;if(event.buttons!==undefined&&!(event.buttons&1)){firing=false;firePointer=null}});
window.addEventListener('pointerup',event=>{if(event.button===0&&event.pointerId===firePointer){firing=false;firePointer=null}});
window.addEventListener('pointercancel',()=>{firing=false;firePointer=null});
function segmentHits(ax,ay,bx,by,cx,cy,rx,ry){
 const sx=(ax-cx)/rx,sy=(ay-cy)/ry,dx=(bx-ax)/rx,dy=(by-ay)/ry;
 const t=Math.max(0,Math.min(1,-(sx*dx+sy*dy)/(dx*dx+dy*dy||1)));return Math.hypot(sx+t*dx,sy+t*dy)<=1;
}
function paintCombat(dt){
 combatTime+=dt;if(firing)fireHarpoon();scene.dataset.shots=String(totalShots);scene.dataset.firing=String(firing);hitFlash=Math.max(0,hitFlash-dt);
 for(let i=harpoons.length-1;i>=0;i--){const p=harpoons[i],ox=p.x,oy=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.age+=dt;
 const b=bossTarget,hit=b&&bossHP>0&&(segmentHits(ox,oy,p.x,p.y,b.x+b.flip*b.w*.11,b.y,b.w*.25,b.h*.35)||segmentHits(ox,oy,p.x,p.y,b.x-b.flip*b.w*.29,b.y-b.h*.12,b.w*.17,b.h*.27));
 if(hit){bossHP=Math.max(0,bossHP-25);hitFlash=.14;hitNumbers.push({x:p.x,y:p.y,age:0});for(let j=0;j<10;j++)bossDust.push({x:p.x,y:p.y,vx:(Math.random()-.5)*95,vy:(Math.random()-.5)*95,life:0,r:1+Math.random()*2});harpoons.splice(i,1);if(!bossHP){firing=false;firePointer=null;bossPhase='defeated';document.getElementById('retry').hidden=false;document.getElementById('nextLevel').hidden=currentLevel!==0;harpoons.length=0;break}continue}
 if(p.age>2||p.x<-50||p.x>w+50||p.y<-50||p.y>h+50){harpoons.splice(i,1);continue}
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.strokeStyle='rgba(165,246,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-44,0);ctx.lineTo(-14,0);ctx.stroke();ctx.strokeStyle='#e0efdc';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-19,0);ctx.lineTo(9,0);ctx.stroke();ctx.fillStyle='#ffe3a0';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(4,-4);ctx.lineTo(6,0);ctx.lineTo(4,4);ctx.closePath();ctx.fill();ctx.restore();
 }
 for(let i=hitNumbers.length-1;i>=0;i--){const n=hitNumbers[i];n.age+=dt;ctx.save();ctx.globalAlpha=Math.max(0,1-n.age);ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffdb98';ctx.shadowColor='#173645';ctx.shadowBlur=5;ctx.fillText('-25',n.x,n.y-12-n.age*35);ctx.restore();if(n.age>1)hitNumbers.splice(i,1)}
 scene.dataset.bossHp=String(bossHP);scene.dataset.harpoons=String(harpoons.length);
}
 document.getElementById('retry').addEventListener('click',()=>{resetBossPatrol();firing=false;firePointer=null;bossHP=levels[currentLevel].hp;bossPhase='patrol';phaseTime=0;hitFlash=0;bossDust.length=0;harpoons.length=0;hitNumbers.length=0;document.getElementById('retry').hidden=true;document.getElementById('nextLevel').hidden=true;scene.focus({preventScroll:true})});
function switchLevel(index){
resetBossPatrol();currentLevel=index;firing=false;firePointer=null;held.clear();diver.x=512/WORLD_W;diver.y=.48;diver.dir=1;diver.vx=0;diver.vy=0;cameraX=0;bossHP=levels[index].hp;bossTime=0;phaseTime=0;bossPhase='patrol';bossTarget=null;bossDust.length=0;harpoons.length=0;hitNumbers.length=0;bubbles.length=0;hitFlash=0;lastShot=-1;worldReady=false;worldCtx.clearRect(0,0,WORLD_W,CAMERA_H);composeWorld();
document.getElementById('retry').hidden=true;document.getElementById('nextLevel').hidden=true;document.getElementById('level1').setAttribute('aria-pressed',String(index===0));document.getElementById('level2').setAttribute('aria-pressed',String(index===1));document.querySelector('.kicker').textContent='LEVEL '+(index+1);document.querySelector('h1').textContent=levels[index].title;scene.focus({preventScroll:true});}
document.getElementById('level1').addEventListener('click',()=>switchLevel(0));document.getElementById('level2').addEventListener('click',()=>switchLevel(1));document.getElementById('nextLevel').addEventListener('click',()=>switchLevel(1));
let paused=reduced,w=0,h=0,x=0,y=0,targetX=0,targetY=0,time=0,last=performance.now();
const motes=Array.from({length:55},(_,i)=>({x:Math.random(),y:Math.random(),z:1+(i%3),v:Math.random()*.006+.004}));
function paintOcean(foreground=false){
 ctx.save();
 if(!foreground){
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<9;i++){const px=i*470+Math.sin(time*.18+i)*36;
   const glow=ctx.createLinearGradient(px,0,px+180,580);glow.addColorStop(0,'rgba(170,244,240,.09)');glow.addColorStop(1,'rgba(100,224,235,0)');
   ctx.fillStyle=glow;ctx.beginPath();ctx.moveTo(px-30,0);ctx.lineTo(px+35,0);ctx.lineTo(px+260,580);ctx.lineTo(px+100,580);ctx.closePath();ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  for(let i=0;i<30;i++){const dir=i%2?1:-1,px=((i*137+time*dir*(12+i%4*3))%WORLD_W+WORLD_W)%WORLD_W,py=160+(i%7)*46+Math.sin(time*.7+i)*9;
   ctx.save();ctx.translate(px,py);ctx.scale(dir,1);ctx.fillStyle=currentLevel?'rgba(86,178,186,.35)':'rgba(15,82,110,.3)';ctx.beginPath();ctx.ellipse(0,0,7,2.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(-10,-4);ctx.lineTo(-10,4);ctx.closePath();ctx.fill();ctx.restore();
  }
  for(let i=0;i<36;i++){const py=720-((time*(14+i%5*3)+i*97)%730),px=i*109+Math.sin(time*.8+i)*9;ctx.strokeStyle='rgba(196,246,246,.24)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,1.5+i%3,0,Math.PI*2);ctx.stroke();}
 }else{
  for(let i=0;i<48;i++){const px=i*83+20,base=724,height=28+(i*37%65),sway=Math.sin(time*1.15+i*.8)*9;
   if(px<cameraX-40||px>cameraX+1320)continue;
   ctx.strokeStyle=currentLevel?'rgba(25,100,117,.75)':'rgba(8,69,72,.8)';ctx.lineWidth=3+i%3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,base);ctx.bezierCurveTo(px-6,base-height*.35,px+sway,base-height*.7,px+sway*1.6,base-height);ctx.stroke();
  }
 }
 ctx.restore();
}
function resize(){w=WORLD_W;h=CAMERA_H;canvas.width=CAMERA_W;canvas.height=CAMERA_H;scene.style.setProperty('--viewport-scale',Math.min(window.innerWidth/CAMERA_W,window.innerHeight/CAMERA_H));}
function label(){motion.textContent=paused?'繼續動態':'暫停動態';motion.setAttribute('aria-pressed',String(paused))}
scene.addEventListener('pointermove',e=>{const r=scene.getBoundingClientRect();targetX=(e.clientX-r.left)/r.width-.5;targetY=(e.clientY-r.top)/r.height-.5});
scene.addEventListener('pointerleave',()=>{targetX=0;targetY=0;firing=false;firePointer=null});
motion.addEventListener('click',()=>{paused=!paused;label()});
full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await scene.requestFullscreen()}catch{full.textContent='此瀏覽器未支援全螢幕'}});
document.addEventListener('fullscreenchange',()=>{full.textContent=document.fullscreenElement?'離開全螢幕':'全螢幕欣賞';resize()});
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!paused){time+=dt;x+=(targetX-x)*.025;y+=(targetY-y)*.025;scene.style.setProperty('--x',(-x*22+Math.sin(time*.12)*2)+'px');scene.style.setProperty('--y',(-y*15)+'px');scene.style.setProperty('--light',(x*34+Math.sin(time*.2)*15)+'px')}
cameraX+=(Math.max(0,Math.min(WORLD_W-CAMERA_W,diver.x*w-CAMERA_W*.46))-cameraX)*(1-Math.exp(-dt*6));ctx.clearRect(0,0,CAMERA_W,CAMERA_H);ctx.fillStyle='#0b7096';ctx.fillRect(0,0,CAMERA_W,CAMERA_H);ctx.drawImage(worldLayer,cameraX,0,CAMERA_W,CAMERA_H,0,0,CAMERA_W,CAMERA_H);ctx.save();ctx.translate(-cameraX,0);paintOcean();for(const p of motes){if(!paused)p.y=(p.y-p.v*dt+1)%1;const px=p.x*w-x*p.z*19+Math.sin(time*.2+p.x*20)*p.z*3,py=p.y*h-y*p.z*15;ctx.beginPath();ctx.fillStyle='rgba(208,251,249,'+(.06+p.z*.04)+')';ctx.arc(px,py,p.z*.6,0,Math.PI*2);ctx.fill()}paintBoss(paused?0:dt);paintDiver(worldReady?dt:0);paintCombat(worldReady?dt:0);
ctx.save();ctx.beginPath();for(let n=0;n<3;n++){const left=n*1280;ctx.moveTo(left,618);ctx.lineTo(left+120,642);ctx.lineTo(left+290,699);ctx.lineTo(left+420,720);ctx.lineTo(left,720);ctx.closePath();ctx.moveTo(left+1040,690);ctx.lineTo(left+1190,649);ctx.lineTo(left+1280,610);ctx.lineTo(left+1280,720);ctx.lineTo(left+990,720);ctx.closePath()}ctx.clip();ctx.drawImage(worldLayer,0,0);ctx.restore();paintOcean(true);ctx.restore();
scene.dataset.cameraX=cameraX.toFixed(1);scene.dataset.cameraSize='1280x720';scene.dataset.worldSize='3840x720';
const zone=Math.min(3,Math.floor(diver.x*w/1280)+1);scene.dataset.zone=String(zone);scene.dataset.level=String(currentLevel+1);const level=levels[currentLevel];document.querySelector('.status').textContent='第 '+(currentLevel+1)+' 關 / 場景 '+zone+' · '+level.title;document.querySelector('.place').textContent='場景 '+zone+' · '+level.names[zone-1];document.querySelector('.location').textContent=!worldReady?'場景載入中':bossHP<=0?(currentLevel===0?'第 1 關完成 · 可前往第 2 關':'第 2 關完成 · 幽光深淵探索成功'):'CAMERA 1280 × 720 / '+(zone<3?'向右探索場景 '+(zone+1):level.boss+'棲地');
requestAnimationFrame(frame)}
resize();label();window.addEventListener('resize',resize);requestAnimationFrame(frame);
})();
</script>
